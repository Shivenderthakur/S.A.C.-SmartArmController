name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk: ${{ steps.version.outputs.apk }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned: a newer stable brings a newer analyzer, and `flutter analyze`
      # fails on its new infos. Bump this on purpose, not by accident.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      # The version lives in pubspec.yaml; the run number is the build number,
      # so every build's versionCode is higher than the last.
      - name: Read the version
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version" || { echo "::error::no x.y.z version in pubspec.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk=smart-arm-$version.apk" >> "$GITHUB_OUTPUT"

      # The model is not in the repo, and the Android build needs it in assets.
      - name: Fetch the hand landmarker model
        run: ./tools/fetch_model.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Android installs an update only if it carries the same signature as the
      # installed app, so releases must all use one key. Without the secrets
      # (forks, or before they are set up) the APK gets a throwaway debug key.
      #
      # A secret that is present but unreadable here is nearly always in the
      # wrong place, so say which ones are empty rather than just that signing
      # is off - the four names below have to be *repository* secrets on *this*
      # repository, under Settings -> Secrets and variables -> Actions.
      - name: Set up the release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then missing="$missing ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing ANDROID_KEY_PASSWORD"; fi

          if [ -n "$missing" ]; then
            echo "::warning::Not signing. Empty here:$missing"
            echo "::warning::They must be Repository secrets on this repository, under the Actions tab of Settings -> Secrets and variables - not Dependabot, not Codespaces, and not an Environment secret (no job here declares an environment)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Present but malformed is worse than absent: it would produce a
          # keystore Gradle cannot open, halfway through the build.
          if ! echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w0 your-release.jks"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::the keystore does not open with ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi

          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }}
          cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}

  # Only a push to main releases, and only this job can write to the repo.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
      APK: ${{ needs.build.outputs.apk }}
      SIGNED: ${{ needs.build.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: Tag and publish a new version
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG is already released. Bump the version in pubspec.yaml to publish a new one."
            exit 0
          fi
          if [ "$SIGNED" != true ]; then
            echo "::error::$TAG was signed with a throwaway debug key, which cannot update an installed app. Add the signing secrets described in CONTRIBUTING.md, then re-run ALL jobs - re-running only the failed job reuses this build's result and fails again. The build job's log names any secret that was empty."
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
