name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The model is not in the repo, and the Android build needs it in assets.
      - name: Fetch the hand landmarker model
        run: ./tools/fetch_model.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: smart-arm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
