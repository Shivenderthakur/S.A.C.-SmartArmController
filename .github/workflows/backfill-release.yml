name: Backfill release

# Publishes an older version as a proper release.
#
# The release job in ci.yml only ever publishes the version currently in
# pubspec.yaml, and the workflow that shipped alongside v1 and v2 named its
# artifacts after the CI run number. This workflow runs from main - so it uses
# today's naming and today's signing - but checks out the old commit, so the
# APK is built from the source that version actually shipped.
#
# Run it from Actions -> Backfill release -> Run workflow, giving a tag or a
# commit SHA.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build and publish (e.g. v1.0.0, or 86c1bf7)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The signing secrets are Environment secrets on sac-env, and a job is
    # given only the secrets of an environment it declares. Without this line
    # all four read as empty and the APK falls back to a debug key.
    environment: sac-env
    permissions:
      contents: write
    concurrency: release
    env:
      # The input is interpolated into `with:` only. Anything a shell reads
      # comes through the environment, so a crafted ref cannot inject script.
      REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the version being released
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # The workspace holds the old commit, so the patch script below - which
      # only exists at the tip - has to be fetched separately.
      - name: Fetch the tooling from the current tip
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .backfill
          sparse-checkout: tools

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Read the version from that commit
        id: version
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version" || { echo "::error::no x.y.z version in pubspec.yaml at $REF"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=smart-arm-$version.apk" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $version from $(git rev-parse --short HEAD)"

      # Older commits may predate the script, and the model is not in the repo.
      - name: Fetch the hand landmarker model
        run: |
          if [ -x tools/fetch_model.sh ]; then
            ./tools/fetch_model.sh
          else
            echo "::warning::no tools/fetch_model.sh at $REF - skipping"
          fi

      - run: flutter pub get

      # Without the secrets the build falls back to the runner's debug key.
      # That still publishes, but the runner makes a new debug key every run,
      # so no two releases can be installed over each other.
      - name: Set up the release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then missing="$missing ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing ANDROID_KEY_PASSWORD"; fi

          if [ -n "$missing" ]; then
            echo "::warning::Not signing. Empty here:$missing"
            echo "::warning::This APK gets the runner's throwaway debug key, so it cannot be installed over another version. These live on the sac-env environment: Settings -> Environments -> sac-env. This job only receives them because it declares 'environment: sac-env', so check that line is still here."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Present but malformed is worse than absent: it would produce a
          # keystore Gradle cannot open, halfway through the build.
          if ! echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w0 your-release.jks"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::the keystore does not open with ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi

          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # v1 and v2 predate the signing wiring: their build.gradle.kts always
      # selects the debug key. With key.properties present this makes them use
      # it; with no secrets the patched code finds no keystore and falls back
      # to debug on its own, so it is safe either way.
      - name: Make the old build config read the release key
        run: python3 .backfill/tools/enable_release_signing.py android/app/build.gradle.kts

      # No analyze or test: this is old source against a newer analyzer, and
      # the point is to reproduce what shipped, not to re-judge it.
      - name: Build the release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"

      # Proof, not assumption: compare the APK's signing certificate against
      # the keystore's own fingerprint. Only meaningful when there is a
      # keystore to compare against.
      - name: Verify the APK carries the release key
        if: steps.signing.outputs.signed == 'true'
        env:
          APK: ${{ steps.version.outputs.apk }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-Z' 'a-z')

          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=$(ls "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$apksigner" || { echo "::error::no apksigner in $sdk/build-tools"; exit 1; }

          actual=$("$apksigner" verify --print-certs "$APK" \
            | grep -m1 -i 'SHA-256 digest' | sed 's/.*: *//' | tr -d ': ' | tr 'A-Z' 'a-z')

          echo "keystore fingerprint: $expected"
          echo "apk certificate:      $actual"
          if [ -z "$expected" ] || [ -z "$actual" ]; then
            echo "::error::could not read one of the fingerprints"
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::$APK is NOT signed with the release key - refusing to publish"
            exit 1
          fi
          echo "signature verified"

      - name: Publish it at that commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
          SHA: ${{ steps.version.outputs.sha }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v$VERSION"
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"

          NOTES="Built from \`$SHA\`, the commit this version shipped at."
          if [ "$SIGNED" != true ]; then
            NOTES="$NOTES

          Signed with a debug key rather than a release key, so uninstall any other version before installing this one."
          fi

          # The release may already exist from a previous attempt; replace the
          # asset rather than failing the run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists - replacing its APK"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$SHA" \
              --title "$TAG" \
              --notes "$NOTES" \
              $FLAGS
          fi
